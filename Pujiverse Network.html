// ============================================================
// PUJIVERSE NETWORK — Supabase Service Layer
// Centralises all DB reads/writes + Excel import.
// Falls back to localStorage when Supabase is unavailable.
// ============================================================

const PVDB = (function () {
  let client = null;

  function setClient(c) { client = c; }
  function ready() { return !!client; }

  // ---- generic helpers ----
  async function selectAll(table, opts = {}) {
    if (!client) return { data: lsGet(table), error: null, local: true };
    let q = client.from(table).select('*');
    if (opts.eq) for (const [k, v] of Object.entries(opts.eq)) q = q.eq(k, v);
    if (opts.order) q = q.order(opts.order, { ascending: opts.asc !== false });
    if (opts.limit) q = q.limit(opts.limit);
    const { data, error } = await q;
    if (error) return { data: lsGet(table), error, local: true };
    if (data) lsSet(table, data);
    return { data: data || [], error: null, local: false };
  }

  async function insert(table, rows) {
    if (!client) { lsAppend(table, rows); return { error: null, local: true }; }
    const { data, error } = await client.from(table).insert(rows).select();
    return { data, error, local: false };
  }

  async function upsert(table, rows, onConflict) {
    if (!client) { lsAppend(table, rows); return { error: null, local: true }; }
    const { data, error } = await client.from(table).upsert(rows, onConflict ? { onConflict } : undefined).select();
    return { data, error, local: false };
  }

  async function update(table, id, patch) {
    if (!client) return { error: null, local: true };
    const { data, error } = await client.from(table).update(patch).eq('id', id).select();
    return { data, error };
  }

  async function remove(table, id) {
    if (!client) return { error: null, local: true };
    const { error } = await client.from(table).delete().eq('id', id);
    return { error };
  }

  // ---- localStorage fallback ----
  function lsKey(t) { return 'pvdb_' + t; }
  function lsGet(t) { try { return JSON.parse(localStorage.getItem(lsKey(t)) || '[]'); } catch { return []; } }
  function lsSet(t, arr) { try { localStorage.setItem(lsKey(t), JSON.stringify(arr)); } catch {} }
  function lsAppend(t, rows) {
    const cur = lsGet(t);
    const list = Array.isArray(rows) ? rows : [rows];
    list.forEach(r => cur.push({ id: 'local_' + Math.random().toString(36).slice(2), created_at: new Date().toISOString(), ...r }));
    lsSet(t, cur);
  }

  // ---- Excel import (expects SheetJS `XLSX` global) ----
  // Returns { summary: {table: count}, errors: [] }
  async function importWorkbook(arrayBuffer) {
    if (typeof XLSX === 'undefined') throw new Error('SheetJS (XLSX) not loaded');
    const wb = XLSX.read(arrayBuffer, { type: 'array' });
    const sheetMap = {
      Channels:      { table: 'channels',        conflict: 'sno',
        map: r => ({ sno: s(r.sno), name: s(r.name), handle: s(r.handle), category: s(r.category) }) },
      Videos:        { table: 'videos',
        map: r => ({ channel_sno: s(r.channel_sno), playlist: s(r.playlist), title: s(r.title),
          description: s(r.description), url: s(r.url), status: s(r.status) || 'upcoming',
          scheduled_at: dt(r.scheduled_at), views: n(r.views), likes: n(r.likes),
          comments: n(r.comments), is_popular: b(r.is_popular), thumbnail_url: s(r.thumbnail_url) }) },
      Subscribers:   { table: 'subscribers',
        map: r => ({ channel_sno: s(r.channel_sno), name: s(r.name), email: s(r.email),
          source: s(r.source), joined_at: dt(r.joined_at), is_member: b(r.is_member), notes: s(r.notes) }) },
      Announcements: { table: 'announcements',
        map: r => ({ channel_sno: s(r.channel_sno) || null, title: s(r.title), body: s(r.body),
          link: s(r.link), pinned: b(r.pinned), published_at: dt(r.published_at) }) },
      Posts:         { table: 'posts',
        map: r => ({ channel_sno: s(r.channel_sno) || null, platform: s(r.platform), title: s(r.title),
          body: s(r.body), link: s(r.link), posted_at: dt(r.posted_at) }) },
      Lottery:       { table: 'lottery_entries',
        map: r => ({ channel_sno: s(r.channel_sno), name: s(r.name), email: s(r.email),
          ticket: s(r.ticket), numbers: s(r.numbers), entered_at: dt(r.entered_at),
          is_winner: b(r.is_winner), prize: s(r.prize) }) },
    };
    const summary = {}; const errors = [];
    for (const [sheetName, cfg] of Object.entries(sheetMap)) {
      if (!wb.SheetNames.includes(sheetName)) continue;
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { defval: '' });
      const clean = rows.map(cfg.map).filter(r => {
        // require a meaningful field
        return r.title || r.name || r.sno || r.email || r.link;
      });
      if (!clean.length) { summary[cfg.table] = 0; continue; }
      let res;
      if (cfg.conflict) res = await upsert(cfg.table, clean, cfg.conflict);
      else res = await insert(cfg.table, clean);
      if (res.error) errors.push(`${sheetName}: ${res.error.message || res.error}`);
      summary[cfg.table] = clean.length;
    }
    return { summary, errors };
  }

  // coercion helpers
  function s(v) { return v == null ? '' : String(v).trim(); }
  function n(v) { const x = Number(v); return isNaN(x) ? 0 : x; }
  function b(v) { return v === true || /^(true|yes|1)$/i.test(String(v).trim()); }
  function dt(v) {
    if (!v) return null;
    if (v instanceof Date) return v.toISOString();
    const d = new Date(v);
    return isNaN(d) ? null : d.toISOString();
  }

  return { setClient, ready, selectAll, insert, upsert, update, remove, importWorkbook, lsGet };
})();

// --- Helper: Extract YouTube video ID from any YouTube URL ---
function ytId(url) {
  if (!url) return null;
  const m = url.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/|live\/)|youtu\.be\/)([\w-]{11})/);
  return m ? m[1] : null;
}

// --- Helper: Build a YouTube search URL for a playlist title (fallback when no direct URL) ---
function plSearchUrl(channel, plTitle) {
  return `https://www.youtube.com/${channel.handle}/search?query=${encodeURIComponent(plTitle)}`;
}

  return (

// ---------- Rocket cursor ----------
function RocketCursor() {
  const ref = React.useRef(null);
  const pos = React.useRef({ x: 0, y: 0, px: 0, py: 0 });

  React.useEffect(() => {
    const el = ref.current;
    let raf;
    const move = (e) => {
      pos.current.px = pos.current.x;
      pos.current.py = pos.current.y;
      pos.current.x = e.clientX;
      pos.current.y = e.clientY;
    };
    const tick = () => {
      const p = pos.current;
      const dx = p.x - p.px, dy = p.y - p.py;
      const ang = Math.atan2(dy, dx) * 180 / Math.PI + 90;
      if (el) el.style.transform = `translate(${p.x}px, ${p.y}px) rotate(${ang}deg)`;
      raf = requestAnimationFrame(tick);
    };
    window.addEventListener('mousemove', move);
    raf = requestAnimationFrame(tick);
    return () => { window.removeEventListener('mousemove', move); cancelAnimationFrame(raf); };
  }, []);

  // hide on touch devices
  if (typeof window !== 'undefined' && 'ontouchstart' in window) return null;

  return (
    <div ref={ref} style={{
      position: 'fixed', top: 0, left: 0, width: 0, height: 0,
      pointerEvents: 'none', zIndex: 9999, marginLeft: -14, marginTop: -14,
      transition: 'transform 0.05s linear',
    }}>
      <svg width="28" height="28" viewBox="0 0 24 24" style={{ filter: 'drop-shadow(0 0 6px #22d3ee)' }}>
        <path d="M12 2c2.5 2 4 5.5 4 9 0 1.4-.3 2.7-.8 3.9L12 22l-3.2-7.1A9.8 9.8 0 0 1 8 11c0-3.5 1.5-7 4-9z" fill="#e8e8f8"/>
        <circle cx="12" cy="9.5" r="1.6" fill="#22d3ee"/>
        <path d="M8.5 13l-2 3 3-1zM15.5 13l2 3-3-1z" fill="#c084fc"/>
        <path d="M10.4 18h3.2l-1.6 4z" fill="#fb923c"/>
      </svg>
    </div>
  );
}

// ---------- Animated starfield (canvas) ----------
function CosmicCanvas() {
  const ref = React.useRef(null);
  React.useEffect(() => {
    const cv = ref.current; if (!cv) return;
    const ctx = cv.getContext('2d');
    let w, h, stars = [], raf;
    const resize = () => {
      w = cv.width = window.innerWidth; h = cv.height = window.innerHeight;
      stars = Array.from({ length: Math.min(220, Math.floor(w * h / 9000)) }, () => ({
        x: Math.random() * w, y: Math.random() * h, z: Math.random() * 1.5 + 0.3,
        tw: Math.random() * Math.PI * 2,
      }));
    };
    resize();
    window.addEventListener('resize', resize);
    const draw = () => {
      ctx.clearRect(0, 0, w, h);
      for (const s of stars) {
        s.tw += 0.02;
        const a = 0.4 + Math.sin(s.tw) * 0.4;
        ctx.fillStyle = `rgba(255,255,255,${a * s.z})`;
        ctx.beginPath(); ctx.arc(s.x, s.y, s.z, 0, 7); ctx.fill();
      }
      raf = requestAnimationFrame(draw);
    };
    draw();
    return () => { window.removeEventListener('resize', resize); cancelAnimationFrame(raf); };
  }, []);
  return <canvas ref={ref} style={{ position: 'fixed', inset: 0, zIndex: 0, pointerEvents: 'none' }} />;
}

          }}>PUJI<br />VERSE</div>

          {rings.map((rch, ri) => {
            const radius = 130 + ri * 95;
            const dur = 60 + ri * 24; // seconds per revolution
            return (
              <React.Fragment key={ri}>
                {/* orbit ring */}
                <div style={{

function analyzePlaylists(ch, videos) {
  if (!videos.length) return [];

  const max = Math.max(...arr.map(a => a.views), 1);
  arr.forEach(a => a.pct = Math.round(a.views / max * 100));
  return arr.slice(0, 5);

// PUJIVERSE NETWORK — AI CHAT AGENT
// Floating widget. Tries OpenAI (via Supabase Edge Function),
// falls back to a smart rule-based assistant over local data.

function sessionId() {
  let id = localStorage.getItem('pv_chat_session');
  if (!id) { id = 'sess_' + Math.random().toString(36).slice(2) + Date.now().toString(36); localStorage.setItem('pv_chat_session', id); }
  return id;
}

// Rule-based fallback brain — answers from CHANNELS / SOCIAL_LINKS / data
function localBrain(q, data) {
  const t = (q || '').toLowerCase();
  const chans = (data.channels && data.channels.length ? data.channels : CHANNELS);

  // greeting
  if (/^(hi|hey|hello|yo|namaste|hola)\b/.test(t))
    return `Hey! 🪐 I'm the Pujiverse assistant. Ask me about any of our ${chans.length} channels, where to find a topic, our lottery, or social links.`;

  // lottery
  if (/lottery|lucky|draw|winner|ticket/.test(t)) {
    const entries = data.lottery_entries || [];
    const winners = entries.filter(e => e.is_winner).length;
    return `🎰 Our lottery currently has ${entries.length} entries${winners ? ` and ${winners} winner(s)` : ''}. You can enter from any channel's Lottery moon. Want me to point you to a specific channel?`;
  }

  // social / where to follow
  if (/follow|social|instagram|twitter|tiktok|discord|facebook|where.*find|links?/.test(t)) {
    const top = SOCIAL_LINKS.slice(0, 6).map(s => `${s.platform}: ${s.url}`).join('\n');
    return `Here's where to follow Pujiverse:\n${top}\n…and more on the Social page. 🚀`;
  }

  // recommend by topic — match channel categories/names/playlists
  const matches = chans.filter(c => {
    const blob = (c.name + ' ' + c.cat + ' ' + (c.playlists || []).join(' ')).toLowerCase();
    return t.split(/\s+/).filter(w => w.length > 3).some(w => blob.includes(w));
  }).slice(0, 4);
  if (matches.length) {
    return `Based on that, check out:\n` + matches.map(c => `• ${c.name} (${c.cat}) — ${c.url}`).join('\n') + `\n\nClick its planet in the solar system to explore videos, popular content and posts.`;
  }

  // count / list
  if (/how many|number of|count/.test(t) && /channel/.test(t))
    return `Pujiverse Network runs ${chans.length} channels across categories like Science & Tech, Entertainment, Education, Gaming, Finance and more. 🌌`;

  if (/help|what can you|who are you/.test(t))
    return `I can: recommend a channel for any topic, find where to watch something, share our social links, and explain the lottery. Try "I want crypto videos" or "where do I follow you on Instagram".`;

  return `I can help you navigate Pujiverse's ${chans.length} channels, find videos on a topic, share social links, or explain the lottery. What are you into — tech, mystery, finance, gaming, something else?`;
}

function AIChat({ supabase, supabaseUrl, data }) {
  const [open, setOpen] = React.useState(false);
  const [msgs, setMsgs] = React.useState([{ role: 'assistant', content: "Hi! 🚀 I'm your Pujiverse guide. Ask me anything about our channels, videos, lottery, or where to follow us." }]);
  const [input, setInput] = React.useState('');
  const [busy, setBusy] = React.useState(false);
  const bodyRef = React.useRef(null);

  React.useEffect(() => { if (bodyRef.current) bodyRef.current.scrollTop = bodyRef.current.scrollHeight; }, [msgs, open]);

  async function logMessage(role, content) {
    try {
      if (supabase) await supabase.from('messages').insert({ session_id: sessionId(), role, content });
    } catch {}
  }

  async function askAgent(question) {
    // Try edge function first
    if (supabaseUrl) {
      try {
        const fnUrl = supabaseUrl.replace(/\/$/, '') + '/functions/v1/chat-agent';
        const res = await fetch(fnUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: question, session_id: sessionId() }),
        });
        if (res.ok) {
          const j = await res.json();
          if (j && j.reply) return j.reply;
        }
      } catch (e) { /* fall through to local brain */ }
    }
    return localBrain(question, data);
  }

  async function send() {
    const q = input.trim();
    if (!q || busy) return;
    setInput('');
    setMsgs(m => [...m, { role: 'user', content: q }]);
    logMessage('user', q);
    setBusy(true);
    const reply = await askAgent(q);
    setMsgs(m => [...m, { role: 'assistant', content: reply }]);
    logMessage('assistant', reply);
    setBusy(false);
  }

  return (
    <>
      {/* launcher */}
      <button onClick={() => setOpen(o => !o)} title="Ask Pujiverse AI" style={{
        position: 'fixed', bottom: 24, right: 24, zIndex: 9000, width: 58, height: 58, borderRadius: '50%',

        background: 'linear-gradient(135deg,#22d3ee,#c084fc)', color: '#0a0a15',

      }}>{open ? '✕' : '🤖'}</button>

      {open && (
        <div style={{
          position: 'fixed', bottom: 92, right: 24, zIndex: 9000, width: 'min(380px, calc(100vw - 32px))',
          height: 'min(520px, 70vh)', display: 'flex', flexDirection: 'column',
          background: 'rgba(12,12,24,0.97)', border: '1px solid rgba(255,255,255,0.12)', borderRadius: 18,
          boxShadow: '0 20px 60px rgba(0,0,0,0.5)', backdropFilter: 'blur(12px)', overflow: 'hidden'
        }}>
          <div style={{ padding: '14px 16px', borderBottom: '1px solid rgba(255,255,255,0.08)', display: 'flex', alignItems: 'center', gap: 10 }}>
            <span style={{ fontSize: 20 }}>🪐</span>
            <div>
              <div style={{ fontWeight: 700, fontSize: 14 }}>Pujiverse Assistant</div>
              <div style={{ fontSize: 11, color: '#4ade80' }}>● online</div>
            </div>
          </div>

          <div ref={bodyRef} style={{ flex: 1, overflowY: 'auto', padding: 14, display: 'flex', flexDirection: 'column', gap: 10 }}>
            {msgs.map((m, i) => (
              <div key={i} style={{
                alignSelf: m.role === 'user' ? 'flex-end' : 'flex-start', maxWidth: '85%',
                padding: '10px 13px', borderRadius: 14, fontSize: 13.5, lineHeight: 1.45, whiteSpace: 'pre-wrap',
                background: m.role === 'user' ? 'linear-gradient(135deg,#22d3ee,#c084fc)' : 'rgba(255,255,255,0.06)',
                color: m.role === 'user' ? '#0a0a15' : '#e8e8f8',
                border: m.role === 'user' ? 'none' : '1px solid rgba(255,255,255,0.08)'
              }}>{m.content}</div>
            ))}
            {busy && <div style={{ alignSelf: 'flex-start', fontSize: 13, color: 'rgba(255,255,255,0.4)' }}>typing…</div>}
          </div>

          <div style={{ padding: 12, borderTop: '1px solid rgba(255,255,255,0.08)', display: 'flex', gap: 8 }}>
            <input value={input} onChange={e => setInput(e.target.value)} onKeyDown={e => e.key === 'Enter' && send()}
              placeholder="Ask about channels, videos, lottery…"
              style={{ flex: 1, padding: '10px 13px', background: 'rgba(255,255,255,0.06)', border: '1px solid rgba(255,255,255,0.12)', borderRadius: 12, color: '#e8e8f8', fontSize: 13, outline: 'none' }} />
            <button onClick={send} disabled={busy} style={{
              padding: '0 16px', borderRadius: 12, border: 'none', cursor: 'pointer', fontWeight: 700,
              background: 'linear-gradient(135deg,#22d3ee,#c084fc)', color: '#0a0a15'
            }}>➤</button>

}

// ---------- Excel Import tab ----------
function ImportTab({ supabase, onDataChanged }) {
  const [log, setLog] = React.useState([]);
  const [busy, setBusy] = React.useState(false);
  const fileRef = React.useRef(null);
  const add = (msg, ok = true) => setLog(l => [...l, { msg, ok, t: Date.now() }]);

  React.useEffect(() => { if (supabase) PVDB.setClient(supabase); }, [supabase]);

  async function handleFile(e) {
    const f = e.target.files?.[0];
    if (!f) return;
    setBusy(true); setLog([]);
    add(`Reading "${f.name}"…`);
    try {
      const buf = await f.arrayBuffer();
      if (supabase) PVDB.setClient(supabase);
      const { summary, errors } = await PVDB.importWorkbook(buf);
      Object.entries(summary).forEach(([t, n]) => add(`✓ ${t}: ${n} rows ${supabase ? 'pushed to Supabase' : 'saved locally'}`));
      errors.forEach(er => add('✗ ' + er, false));
      if (!Object.keys(summary).length) add('No matching sheets found. Use the provided template.', false);
      add('Done. ' + (supabase ? 'Data is live.' : 'Connect Supabase to make it permanent.'));
      onDataChanged && onDataChanged();
    } catch (err) {
      add('✗ ' + (err.message || err), false);
    } finally {
      setBusy(false);
      if (fileRef.current) fileRef.current.value = '';
    }
  }

  return (
    <div>
      <h3 style={{ fontFamily: "'Space Grotesk',sans-serif", fontSize: 20, fontWeight: 800, margin: '0 0 6px' }}>📥 Import from Excel</h3>
      <p style={{ color: 'rgba(255,255,255,0.45)', fontSize: 13, margin: '0 0 20px' }}>
        Upload <b>PujiverseNetwork_Data.xlsx</b>. Each tab (Videos, Subscribers, Announcements, Posts, Lottery, Channels) is pushed to its matching Supabase table. Videos &amp; channels are upserted (no duplicates); the rest are appended.
      </p>

      <div style={{ border: '2px dashed rgba(34,211,238,0.4)', borderRadius: 16, padding: 36, textAlign: 'center', background: 'rgba(34,211,238,0.04)' }}>
        <div style={{ fontSize: 40, marginBottom: 10 }}>📊</div>
        <input ref={fileRef} type="file" accept=".xlsx,.xls" onChange={handleFile} style={{ display: 'none' }} id="pv-xlsx-input" />
        <label htmlFor="pv-xlsx-input" style={{
          display: 'inline-block', padding: '12px 22px', borderRadius: 12, cursor: busy ? 'wait' : 'pointer',
          background: 'linear-gradient(135deg,#22d3ee,#c084fc)', color: '#0a0a15', fontWeight: 700
        }}>{busy ? 'Importing…' : 'Choose Excel file'}</label>
        <div style={{ fontSize: 12, color: 'rgba(255,255,255,0.4)', marginTop: 12 }}>
          {supabase ? '● Connected to Supabase — data will persist' : '○ Not connected — data saved in browser only (connect in ⚙ Supabase tab)'}
        </div>
      </div>

      {log.length > 0 && (
        <div style={{ marginTop: 20, background: 'rgba(0,0,0,0.3)', border: '1px solid rgba(255,255,255,0.08)', borderRadius: 12, padding: 16, fontFamily: 'monospace', fontSize: 12.5, maxHeight: 260, overflowY: 'auto' }}>
          {log.map((l, i) => <div key={i} style={{ color: l.ok ? '#4ade80' : '#f87171', padding: '2px 0' }}>{l.msg}</div>)}
        </div>
      )}
    </div>
  );
}

// ---------- Global Search tab ----------
function SearchTab({ supabase }) {
  const [q, setQ] = React.useState('');
  const [scope, setScope] = React.useState('videos');
  const [rows, setRows] = React.useState([]);
  const [busy, setBusy] = React.useState(false);
  const [count, setCount] = React.useState(null);

  const scopes = [
    { id: 'videos', label: '🎬 Videos', cols: ['title', 'channel_sno', 'playlist', 'status', 'views', 'url'], search: ['title', 'description', 'playlist'] },
    { id: 'subscribers', label: '👥 Subscribers', cols: ['name', 'email', 'channel_sno', 'source', 'is_member'], search: ['name', 'email', 'source'] },
    { id: 'lottery_entries', label: '🎰 Lottery', cols: ['name', 'email', 'ticket', 'numbers', 'channel_sno', 'is_winner'], search: ['name', 'email', 'ticket'] },
    { id: 'announcements', label: '📣 Announcements', cols: ['title', 'channel_sno', 'published_at'], search: ['title', 'body'] },
    { id: 'posts', label: '📝 Posts', cols: ['title', 'platform', 'channel_sno', 'link'], search: ['title', 'body'] },
  ];
  const cfg = scopes.find(s => s.id === scope);

  React.useEffect(() => { if (supabase) PVDB.setClient(supabase); }, [supabase]);

  async function run() {
    setBusy(true);
    try {
      if (supabase) {
        let query = supabase.from(scope).select('*', { count: 'exact' });
        if (q.trim()) {
          const term = q.trim().replace(/[%,]/g, '');
          const ors = cfg.search.map(c => `${c}.ilike.%${term}%`).join(',');
          query = query.or(ors);
        }
        query = query.limit(200);
        const { data, error, count } = await query;
        if (error) { setRows([{ _err: error.message }]); setCount(null); }
        else { setRows(data || []); setCount(count); }
      } else {
        const all = PVDB.lsGet(scope);
        const t = q.trim().toLowerCase();
        const filtered = t ? all.filter(r => cfg.search.some(c => String(r[c] || '').toLowerCase().includes(t))) : all;
        setRows(filtered.slice(0, 200)); setCount(filtered.length);
      }
    } finally { setBusy(false); }
  }

  React.useEffect(() => { run(); /* eslint-disable-next-line */ }, [scope]);

  return (
    <div>
      <h3 style={{ fontFamily: "'Space Grotesk',sans-serif", fontSize: 20, fontWeight: 800, margin: '0 0 6px' }}>🔎 Search all data</h3>
      <p style={{ color: 'rgba(255,255,255,0.45)', fontSize: 13, margin: '0 0 18px' }}>Find any row fast — even across tens of thousands of records. Searches Supabase directly when connected.</p>

      <div style={{ display: 'flex', gap: 10, marginBottom: 14, flexWrap: 'wrap' }}>
        <select value={scope} onChange={e => setScope(e.target.value)} style={inp(160)}>
          {scopes.map(s => <option key={s.id} value={s.id} style={{ background: '#0e0e1a' }}>{s.label}</option>)}
        </select>
        <input value={q} onChange={e => setQ(e.target.value)} onKeyDown={e => e.key === 'Enter' && run()} placeholder="Type to search… (title, name, email, ticket)" style={{ ...inp(0), flex: 1, minWidth: 220 }} />
        <button onClick={run} style={{ padding: '0 20px', borderRadius: 10, border: 'none', cursor: 'pointer', fontWeight: 700, background: 'linear-gradient(135deg,#22d3ee,#c084fc)', color: '#0a0a15' }}>Search</button>
      </div>

      <div style={{ fontSize: 12, color: 'rgba(255,255,255,0.4)', marginBottom: 10 }}>
        {busy ? 'Searching…' : count != null ? `${count} match${count === 1 ? '' : 'es'}${rows.length < count ? ` (showing first ${rows.length})` : ''}` : ''}
      </div>

      <div style={{ overflowX: 'auto', background: 'rgba(255,255,255,0.02)', border: '1px solid rgba(255,255,255,0.08)', borderRadius: 12 }}>
        <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: 13 }}>
          <thead><tr style={{ background: 'rgba(255,255,255,0.05)' }}>
            {cfg.cols.map(c => <th key={c} style={{ textAlign: 'left', padding: '10px 14px', color: 'rgba(255,255,255,0.55)', fontWeight: 600, whiteSpace: 'nowrap' }}>{c}</th>)}
          </tr></thead>
          <tbody>
            {rows.length === 0 && <tr><td colSpan={cfg.cols.length} style={{ padding: 24, textAlign: 'center', color: 'rgba(255,255,255,0.35)' }}>No results.</td></tr>}
            {rows.map((r, i) => r._err ? (
              <tr key={i}><td colSpan={cfg.cols.length} style={{ padding: 14, color: '#f87171' }}>{r._err} — did you run schema.sql?</td></tr>
            ) : (
              <tr key={r.id || i} style={{ borderTop: '1px solid rgba(255,255,255,0.06)' }}>
                {cfg.cols.map(c => (
                  <td key={c} style={{ padding: '9px 14px', maxWidth: 320, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
                    {c === 'url' || c === 'link' ? (r[c] ? <a href={r[c]} target="_blank" rel="noreferrer" style={{ color: '#22d3ee' }}>open</a> : '—') : String(r[c] ?? '—')}
                  </td>
                ))}
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );

  function inp(w) { return { padding: '10px 14px', background: 'rgba(255,255,255,0.06)', border: '1px solid rgba(255,255,255,0.12)', borderRadius: 10, color: '#e8e8f8', fontSize: 14, outline: 'none', width: w || undefined }; }
}

      {label && <label style={{ fontSize:12, fontWeight:600, color:'rgba(255,255,255,0.45)', textTransform:'uppercase', letterSpacing:1 }}>{label}</label>}
      <textarea
        value={value} onChange={e=>onChange(e.target.value)} rows={rows}
        placeholder={placeholder}
        style={{ padding:'10px 14px', background:'rgba(255,255,255,0.06)', border:'1px solid rgba(255,255,255,0.12)', borderRadius:10, color:'#e8e8f8', fontSize:14, outline:'none', fontFamily:'Inter,sans-serif', resize:'vertical' }}
      />
    </div>
  );
}

function ABtn({ children, onClick, variant="primary", size="md", style={} }) {
  const base = { cursor:'pointer', fontFamily:'Inter,sans-serif', fontWeight:600, border:'none', borderRadius:10, transition:'all 0.15s', ...style };
  const sz = size==="sm" ? { padding:'6px 12px', fontSize:12 } : { padding:'10px 18px', fontSize:14 };
  const col = variant==="primary" ? { background:'linear-gradient(135deg,#22d3ee,#c084fc)', color:'#0a0a15' }
            : variant==="danger"  ? { background:'rgba(239,68,68,0.2)', color:'#f87171', border:'1px solid rgba(239,68,68,0.3)' }
            : variant==="ghost"   ? { background:'rgba(255,255,255,0.05)', color:'rgba(255,255,255,0.6)', border:'1px solid rgba(255,255,255,0.1)' }
            :                       { background:'rgba(255,255,255,0.08)', color:'#e8e8f8', border:'1px solid rgba(255,255,255,0.12)' };
  return <button onClick={onClick} style={{...base,...sz,...col}}>{children}</button>;
}

function LoginModal({ onLogin, onClose }) {

  const handleLogin = () => {

      setStep(2);

      setErr('Invalid credentials. Try again.');

  };

  return (
    <div style={{ position:'fixed', inset:0, background:'rgba(0,0,0,0.9)', zIndex:9000, display:'flex', alignItems:'center', justifyContent:'center', backdropFilter:'blur(12px)' }}>

          </div>

          <div style={{ display:'flex', gap:10 }}>
            <ABtn onClick={handleLogin} variant="primary" style={{ flex:1 }} onKeyDown={e=>e.key==='Enter'&&handleLogin()}>Continue →</ABtn>

function VideosTab({ supabase, localChannels, localVideos, setLocalVideos }) {

  const vids = (selCh && selPl !== '') ? (localVideos[selCh]?.[selPl] || []) : [];

  const addVideo = async () => {
    if (!form.title || !form.url || !selCh || selPl==='') { setMsg('Fill all fields'); return; }
    const updated = JSON.parse(JSON.stringify(localVideos));
    if (!updated[selCh]) updated[selCh] = {};
    if (!updated[selCh][selPl]) updated[selCh][selPl] = [];
    updated[selCh][selPl].push({ title: form.title, url: form.url });
    setLocalVideos(updated);
    localStorage.setItem('pv_videos', JSON.stringify(updated));
    if (supabase) {
      const plName = playlists[parseInt(selPl)];
      await supabase.from('videos').insert([{ channel_sno:selCh, playlist_index:parseInt(selPl), playlist_name:plName, title:form.title, video_url:form.url }]);
    }
    setForm({ title:'', url:'' });
    setMsg('Video added ✓'); setTimeout(()=>setMsg(''), 2000);

            {playlists.map((pl,i)=><option key={i} value={i} style={{background:'#0e0e1a'}}>{pl}</option>)}

      {/* Add video form */}

// ---- SUPABASE CONFIG TAB ----
function ConfigTab({ supabaseUrl, supabaseKey, setSupabaseUrl, setSupabaseKey, onConnect, supabase, localChannels, localVideos, localSocial, localWebsites, localPosts }) {
  const [msg, setMsg] = React.useState('');
  const [syncing, setSyncing] = React.useState(false);
  const [syncLog, setSyncLog] = React.useState([]);

  const save = () => {
    localStorage.setItem('pv_sb_url', supabaseUrl);
    localStorage.setItem('pv_sb_key', supabaseKey);
    onConnect();
    setMsg('Supabase config saved & connected!'); setTimeout(()=>setMsg(''),3000);
  };

  const log = (line, ok=true) => setSyncLog(prev => [...prev, { line, ok, t: new Date().toLocaleTimeString() }]);

  const syncAll = async () => {
    if (!supabase) { log('❌ Not connected to Supabase. Click "Connect Supabase" above first.', false); return; }
    setSyncing(true); setSyncLog([]);

    // 1. CHANNELS — upsert by sno
    try {
      const rows = localChannels.map(ch => ({
        sno: ch.sno, channel_name: ch.name, handle: ch.handle, category: ch.cat,
        youtube_url: ch.url, viral_score: parseInt(ch.score)||0, cpm_tier: ch.cpm,
        team_size: parseInt(ch.team)||1, status: ch.status
      }));
      const { error } = await supabase.from('channels').upsert(rows, { onConflict: 'sno' });
      if (error) throw error;
      log(`✓ channels: ${rows.length} rows synced`);
    } catch(e) { log(`✗ channels: ${e.message || e}`, false); }

    // 2. SOCIAL LINKS — clear + reinsert (simplest)
    try {
      const rows = localSocial.map((s,i) => ({
        platform: s.platform, handle: s.handle, url: s.url,
        icon_key: s.icon, brand_color: s.color, display_order: i, is_active: true
      }));
      await supabase.from('social_links').delete().neq('platform','__none__');
      const { error } = await supabase.from('social_links').insert(rows);
      if (error) throw error;
      log(`✓ social_links: ${rows.length} rows synced`);
    } catch(e) { log(`✗ social_links: ${e.message || e}`, false); }

    // 3. VIDEOS
    try {
      const rows = [];
      Object.entries(localVideos).forEach(([sno, plMap]) => {
        Object.entries(plMap || {}).forEach(([plIdx, vids]) => {
          (vids || []).forEach((v, i) => rows.push({
            channel_sno: sno, playlist_index: parseInt(plIdx),
            playlist_name: localChannels.find(c=>c.sno===sno)?.playlists?.[parseInt(plIdx)] || '',
            title: v.title, video_url: v.url, sort_order: i
          }));
        });
      });
      if (rows.length > 0) {
        await supabase.from('videos').delete().neq('id','00000000-0000-0000-0000-000000000000');
        const { error } = await supabase.from('videos').insert(rows);
        if (error) throw error;
      }
      log(`✓ videos: ${rows.length} rows synced`);
    } catch(e) { log(`✗ videos: ${e.message || e}`, false); }

    // 4. WEBSITES
    try {
      const rows = (localWebsites || []).map(w => ({
        id: w.id, title: w.title, url: w.url, description: w.description || '',
        tags: w.tags || [], accent: w.accent || '#22d3ee'
      }));
      const { error } = await supabase.from('websites').upsert(rows, { onConflict: 'id' });
      if (error) throw error;
      log(`✓ websites: ${rows.length} rows synced`);
    } catch(e) { log(`✗ websites: ${e.message || e} — make sure you ran the new SQL below`, false); }

    // 5. POSTS
    try {
      const rows = (localPosts || []).map(p => ({
        id: p.id, title: p.title, url: p.url, platform: p.platform,
        cover: p.cover || '', summary: p.summary || '',
        post_date: p.date && /^\d{4}-\d{2}-\d{2}$/.test(p.date) ? p.date : null
      }));
      const { error } = await supabase.from('posts').upsert(rows, { onConflict: 'id' });
      if (error) throw error;
      log(`✓ posts: ${rows.length} rows synced`);
    } catch(e) { log(`✗ posts: ${e.message || e} — make sure you ran the new SQL below`, false); }

    // 6. LOTTERY SUBSCRIBERS — across all channels
    try {
      const rows = [];
      localChannels.forEach(ch => {
        try {
          const subs = JSON.parse(localStorage.getItem('pv_lot_subs_' + ch.sno) || '[]');
          subs.forEach(s => rows.push({
            sub_id: s.id, channel_sno: ch.sno,
            name: s.name || '', handle: s.handle || '', email: s.email || '',
            subscriber_id: s.subscriberId || '', phone: s.phone || ''
          }));
        } catch(e) {}
      });
      if (rows.length > 0) {
        await supabase.from('lottery_subscribers').delete().neq('sub_id','__none__');
        const { error } = await supabase.from('lottery_subscribers').insert(rows);
        if (error) throw error;
      }
      log(`✓ lottery_subscribers: ${rows.length} rows synced`);
    } catch(e) { log(`✗ lottery_subscribers: ${e.message || e} — make sure you ran the new SQL below`, false); }

    // 7. LOTTERY HISTORY
    try {
      const hist = JSON.parse(localStorage.getItem('pv_lot_history') || '[]');
      const rows = hist.map(h => ({
        history_id: h.id, channel_name: h.channel, channel_sno: h.channelSno,
        draw_date: h.date, pool_size: h.poolSize, winner_count: h.winnerCount,
        winners: h.winners
      }));
      if (rows.length > 0) {
        const { error } = await supabase.from('lottery_history').upsert(rows, { onConflict: 'history_id' });
        if (error) throw error;
      }
      log(`✓ lottery_history: ${rows.length} rows synced`);
    } catch(e) { log(`✗ lottery_history: ${e.message || e} — make sure you ran the new SQL below`, false); }

    log('— Done —');
    setSyncing(false);
  };

  return (
    <div>
      <h3 style={{ fontFamily:"'Space Grotesk',sans-serif", fontSize:20, fontWeight:800, color:'#f0f0f8', margin:'0 0 6px' }}>Supabase Config</h3>
      <p style={{ color:'rgba(255,255,255,0.4)', fontSize:13, margin:'0 0 24px' }}>Connect your Supabase project to persist all data across devices</p>

      <div style={{ background:'rgba(34,211,238,0.06)', border:'1px solid rgba(34,211,238,0.2)', borderRadius:14, padding:20, marginBottom:24 }}>
        <div style={{ fontSize:13, fontWeight:600, color:'#22d3ee', marginBottom:12 }}>How to connect:</div>
        <ol style={{ margin:0, padding:'0 0 0 20px', color:'rgba(255,255,255,0.55)', fontSize:13, lineHeight:2 }}>
          <li>Go to <a href="https://supabase.com" target="_blank" rel="noreferrer" style={{ color:'#22d3ee' }}>supabase.com</a> → your project</li>
          <li>Settings → API → copy <strong style={{color:'#e8e8f8'}}>Project URL</strong> and <strong style={{color:'#e8e8f8'}}>anon public key</strong></li>
          <li>Paste them below and click Connect</li>
          <li>Run the SQL from the <strong style={{color:'#e8e8f8'}}>SQL Setup</strong> section below to create tables</li>
        </ol>
      </div>

      <div style={{ display:'flex', flexDirection:'column', gap:14, marginBottom:20 }}>
        <AInput label="Supabase Project URL" value={supabaseUrl} onChange={setSupabaseUrl} placeholder="https://xxxx.supabase.co" />
        <AInput label="Supabase Anon Key" value={supabaseKey} onChange={setSupabaseKey} placeholder="eyJhbGciOiJIUzI1NiIsInR5c..." />
      </div>
      <div style={{ display:'flex', gap:12, alignItems:'center', marginBottom:24, flexWrap:'wrap' }}>
        <ABtn onClick={save} variant="primary">Connect Supabase</ABtn>
        {msg && <span style={{ fontSize:13, color:'#4ade80' }}>{msg}</span>}
      </div>

      {/* SYNC PANEL */}
      <div style={{ background:'rgba(74,222,128,0.06)', border:'1px solid rgba(74,222,128,0.25)', borderRadius:14, padding:20, marginBottom:32 }}>
        <div style={{ display:'flex', justifyContent:'space-between', alignItems:'flex-start', gap:14, flexWrap:'wrap', marginBottom:14 }}>
          <div>
            <div style={{ fontFamily:"'Space Grotesk',sans-serif", fontSize:16, fontWeight:800, color:'#4ade80', margin:'0 0 4px' }}>📤 Sync All Data to Supabase</div>
            <p style={{ color:'rgba(255,255,255,0.55)', fontSize:13, margin:0, maxWidth:520 }}>
              Push everything currently in your browser (channels, videos, social links, lottery subs, websites, posts, draw history) to your Supabase tables in one go. Use this anytime your local data is ahead of Supabase. Existing rows are upserted by primary key — no duplicates.
            </p>
          </div>
          <ABtn onClick={syncAll} variant="primary" style={{ background: syncing ? 'rgba(255,255,255,0.1)' : 'linear-gradient(135deg,#4ade80,#22d3ee)' }}>
            {syncing ? 'Syncing…' : '↑ Sync Now'}
          </ABtn>
        </div>
        {syncLog.length > 0 && (
          <div style={{ background:'rgba(0,0,0,0.4)', border:'1px solid rgba(255,255,255,0.06)', borderRadius:10, padding:'10px 14px', fontFamily:'ui-monospace,Menlo,Consolas,monospace', fontSize:12, lineHeight:1.7, maxHeight:240, overflow:'auto' }}>
            {syncLog.map((l, i) => (
              <div key={i} style={{ color: l.ok ? 'rgba(255,255,255,0.7)' : '#fca5a5' }}>
                <span style={{ color:'rgba(255,255,255,0.3)', marginRight:8 }}>{l.t}</span>{l.line}
              </div>
            ))}
          </div>
        )}
        {!supabase && <div style={{ marginTop:10, fontSize:12, color:'#fca5a5' }}>⚠ Not connected yet. Click "Connect Supabase" above first.</div>}
      </div>

      <h4 style={{ fontFamily:"'Space Grotesk',sans-serif", color:'#c084fc', margin:'0 0 12px' }}>SQL Setup — Run in Supabase SQL Editor</h4>
      <pre style={{ background:'rgba(0,0,0,0.4)', border:'1px solid rgba(255,255,255,0.08)', borderRadius:12, padding:20, fontSize:12, color:'#a8d8a8', overflow:'auto', maxHeight:400, lineHeight:1.7 }}>{`-- 1. CHANNELS TABLE
CREATE TABLE IF NOT EXISTS channels (
  id uuid DEFAULT gen_random_uuid() PRIMARY KEY,
  sno text UNIQUE,
  channel_name text NOT NULL,
  handle text,
  category text,
  youtube_url text,
  viral_score integer DEFAULT 0,
  cpm_tier text DEFAULT 'Medium',
  team_size integer DEFAULT 1,
  status text DEFAULT 'LIVE',
  created_at timestamptz DEFAULT now()
);

-- 2. PLAYLISTS TABLE
CREATE TABLE IF NOT EXISTS playlists (
  id uuid DEFAULT gen_random_uuid() PRIMARY KEY,
  channel_sno text REFERENCES channels(sno) ON DELETE CASCADE,
  playlist_name text NOT NULL,
  description text,
  playlist_url text,
  sort_order integer DEFAULT 0,
  created_at timestamptz DEFAULT now()
);

-- 3. VIDEOS TABLE
CREATE TABLE IF NOT EXISTS videos (
  id uuid DEFAULT gen_random_uuid() PRIMARY KEY,
  playlist_id uuid REFERENCES playlists(id) ON DELETE CASCADE,
  channel_sno text,
  playlist_index integer,
  playlist_name text,
  title text NOT NULL,
  video_url text,
  thumbnail_url text,
  description text,
  sort_order integer DEFAULT 0,
  created_at timestamptz DEFAULT now()
);

-- 4. SOCIAL LINKS TABLE
CREATE TABLE IF NOT EXISTS social_links (
  id uuid DEFAULT gen_random_uuid() PRIMARY KEY,
  platform text NOT NULL,
  handle text,
  url text,
  icon_key text,
  brand_color text,
  display_order integer DEFAULT 0,
  is_active boolean DEFAULT true
);

-- 5. WEBSITES TABLE (My Projects on home page)
CREATE TABLE IF NOT EXISTS websites (
  id text PRIMARY KEY,
  title text NOT NULL,
  url text NOT NULL,
  description text,
  tags text[],
  accent text,
  created_at timestamptz DEFAULT now()
);

-- 6. POSTS TABLE (Medium / Blogger / Patreon links)
CREATE TABLE IF NOT EXISTS posts (
  id text PRIMARY KEY,
  title text NOT NULL,
  url text NOT NULL,
  platform text,
  cover text,
  summary text,
  post_date date,
  created_at timestamptz DEFAULT now()
);

-- 7. LOTTERY SUBSCRIBERS TABLE
CREATE TABLE IF NOT EXISTS lottery_subscribers (
  id uuid DEFAULT gen_random_uuid() PRIMARY KEY,
  sub_id text,
  channel_sno text,
  name text NOT NULL,
  handle text,
  email text,
  subscriber_id text,
  phone text,
  created_at timestamptz DEFAULT now()
);

-- 8. LOTTERY HISTORY TABLE (past draws)
CREATE TABLE IF NOT EXISTS lottery_history (
  history_id text PRIMARY KEY,
  channel_name text,
  channel_sno text,
  draw_date text,
  pool_size integer,
  winner_count integer,
  winners jsonb,
  created_at timestamptz DEFAULT now()
);

-- 9. Enable RLS + public read for all tables
ALTER TABLE channels ENABLE ROW LEVEL SECURITY;
ALTER TABLE playlists ENABLE ROW LEVEL SECURITY;
ALTER TABLE videos ENABLE ROW LEVEL SECURITY;
ALTER TABLE social_links ENABLE ROW LEVEL SECURITY;
ALTER TABLE websites ENABLE ROW LEVEL SECURITY;
ALTER TABLE posts ENABLE ROW LEVEL SECURITY;
ALTER TABLE lottery_subscribers ENABLE ROW LEVEL SECURITY;
ALTER TABLE lottery_history ENABLE ROW LEVEL SECURITY;

-- Public read policies
DROP POLICY IF EXISTS "Public read channels" ON channels;
CREATE POLICY "Public read channels" ON channels FOR SELECT USING (true);
DROP POLICY IF EXISTS "Public read playlists" ON playlists;
CREATE POLICY "Public read playlists" ON playlists FOR SELECT USING (true);
DROP POLICY IF EXISTS "Public read videos" ON videos;
CREATE POLICY "Public read videos" ON videos FOR SELECT USING (true);
DROP POLICY IF EXISTS "Public read social" ON social_links;
CREATE POLICY "Public read social" ON social_links FOR SELECT USING (true);
DROP POLICY IF EXISTS "Public read websites" ON websites;
CREATE POLICY "Public read websites" ON websites FOR SELECT USING (true);
DROP POLICY IF EXISTS "Public read posts" ON posts;
CREATE POLICY "Public read posts" ON posts FOR SELECT USING (true);
DROP POLICY IF EXISTS "Public read lottery_subs" ON lottery_subscribers;
CREATE POLICY "Public read lottery_subs" ON lottery_subscribers FOR SELECT USING (true);
DROP POLICY IF EXISTS "Public read lottery_history" ON lottery_history;
CREATE POLICY "Public read lottery_history" ON lottery_history FOR SELECT USING (true);

-- IMPORTANT: write policies (anon key writes from the admin panel)
-- These allow the anon key to insert/update/delete. If you want to lock down writes
-- to authenticated users only, replace USING(true) with USING(auth.role() = 'authenticated').
DROP POLICY IF EXISTS "Anon write channels" ON channels;
CREATE POLICY "Anon write channels" ON channels FOR ALL USING (true) WITH CHECK (true);
DROP POLICY IF EXISTS "Anon write playlists" ON playlists;
CREATE POLICY "Anon write playlists" ON playlists FOR ALL USING (true) WITH CHECK (true);
DROP POLICY IF EXISTS "Anon write videos" ON videos;
CREATE POLICY "Anon write videos" ON videos FOR ALL USING (true) WITH CHECK (true);
DROP POLICY IF EXISTS "Anon write social" ON social_links;
CREATE POLICY "Anon write social" ON social_links FOR ALL USING (true) WITH CHECK (true);
DROP POLICY IF EXISTS "Anon write websites" ON websites;
CREATE POLICY "Anon write websites" ON websites FOR ALL USING (true) WITH CHECK (true);
DROP POLICY IF EXISTS "Anon write posts" ON posts;
CREATE POLICY "Anon write posts" ON posts FOR ALL USING (true) WITH CHECK (true);
DROP POLICY IF EXISTS "Anon write lottery_subs" ON lottery_subscribers;
CREATE POLICY "Anon write lottery_subs" ON lottery_subscribers FOR ALL USING (true) WITH CHECK (true);
DROP POLICY IF EXISTS "Anon write lottery_history" ON lottery_history;
CREATE POLICY "Anon write lottery_history" ON lottery_history FOR ALL USING (true) WITH CHECK (true);`}</pre>
    </div>
  );
}

// ============================================================
// LOTTERY SUBSCRIBERS TAB — per-channel subscriber lists
// ============================================================
function LotterySubsTab({ localChannels }) {
  const [selSno, setSelSno]   = React.useState(localChannels[0]?.sno || '');
  const [subs, setSubs]       = React.useState([]);
  const [paste, setPaste]     = React.useState('');
  const [manForm, setManForm] = React.useState({ name:'', handle:'', email:'', subscriberId:'', phone:'' });
  const [msg, setMsg]         = React.useState('');
  const [search, setSearch]   = React.useState('');

  const showMsg = (m, ok=true) => { setMsg({text:m,ok}); setTimeout(()=>setMsg(''),2500); };
  const uid = () => Math.random().toString(36).slice(2)+Date.now().toString(36);

  // Load subs whenever selected channel changes
  React.useEffect(() => {
    if (!selSno) return;
    try { setSubs(JSON.parse(localStorage.getItem('pv_lot_subs_'+selSno) || '[]')); }
    catch { setSubs([]); }
  }, [selSno]);

  const persist = (arr) => {
    setSubs(arr);
    localStorage.setItem('pv_lot_subs_'+selSno, JSON.stringify(arr));
  };

  const addManual = () => {
    if (!manForm.name.trim()) { showMsg('Name is required', false); return; }
    persist([...subs, { id:uid(), ...manForm }]);
    setManForm({ name:'', handle:'', email:'', subscriberId:'', phone:'' });
    showMsg('Subscriber added ✓');
  };

  const addPaste = () => {
    const lines = paste.split('\n').map(l=>l.trim()).filter(Boolean);
    const newSubs = lines.map(l => {
      const parts = l.split(',').map(s=>s.trim());
      return { id:uid(), name:parts[0]||l, handle:parts[1]||'', email:parts[2]||'', subscriberId:parts[3]||'', phone:parts[4]||'' };
    });
    if (newSubs.length === 0) { showMsg('Nothing to add', false); return; }
    persist([...subs, ...newSubs]);
    setPaste('');
    showMsg(`Added ${newSubs.length} subscribers ✓`);
  };

  const delSub = (id) => persist(subs.filter(s => s.id !== id));
  const clearAll = () => {
    if (!confirm(`Delete ALL ${subs.length} subscribers?`)) return;
    persist([]);
  };

  const filtered = subs.filter(s => {
    const q = search.toLowerCase();
    if (!q) return true;
    return (s.name||'').toLowerCase().includes(q)
      || (s.handle||'').toLowerCase().includes(q)
      || (s.email||'').toLowerCase().includes(q);
  });

  const ch = localChannels.find(c=>c.sno===selSno);
  const accent = ch ? (CAT_COLORS[ch.cat]?.accent || '#c084fc') : '#c084fc';

  return (
    <div>
      <div style={{ display:'flex', justifyContent:'space-between', alignItems:'flex-start', marginBottom:20 }}>
        <div>
          <h3 style={{ fontFamily:"'Space Grotesk',sans-serif", fontSize:20, fontWeight:800, color:'#f0f0f8', margin:0 }}>Lottery Subscribers</h3>
          <p style={{ color:'rgba(255,255,255,0.4)', fontSize:13, margin:'4px 0 0' }}>Each channel has its own private subscriber pool. Public viewers can see the list — only admin can edit.</p>
        </div>
        <a href="Lottery.html" target="_blank" rel="noreferrer" style={{ padding:'8px 14px', background:'rgba(192,132,252,0.15)', border:'1px solid rgba(192,132,252,0.3)', borderRadius:10, color:'#c084fc', fontSize:13, fontWeight:600, textDecoration:'none' }}>🎰 Open Lottery →</a>
      </div>

      {/* Channel picker */}
      <div style={{ background:'rgba(255,255,255,0.03)', border:'1px solid rgba(255,255,255,0.08)', borderRadius:14, padding:16, marginBottom:20 }}>
        <label style={{ fontSize:11, fontWeight:600, color:'rgba(255,255,255,0.4)', textTransform:'uppercase', letterSpacing:1, display:'block', marginBottom:8 }}>Select channel</label>
        <select value={selSno} onChange={e=>setSelSno(e.target.value)} style={{ width:'100%', padding:'10px 14px', background:'rgba(255,255,255,0.06)', border:'1px solid rgba(255,255,255,0.12)', borderRadius:10, color:'#e8e8f8', fontSize:14, outline:'none' }}>
          {localChannels.map(c => {
            const cnt = (() => { try { return (JSON.parse(localStorage.getItem('pv_lot_subs_'+c.sno) || '[]')).length; } catch { return 0; } })();
            return <option key={c.sno} value={c.sno} style={{background:'#0e0e1a'}}>{c.name} — {cnt} sub{cnt!==1?'s':''}</option>;
          })}
        </select>
      </div>

      {ch && (
        <div style={{ background:`${accent}10`, border:`1px solid ${accent}33`, borderRadius:16, padding:'16px 20px', marginBottom:20, display:'flex', alignItems:'center', justifyContent:'space-between', flexWrap:'wrap', gap:12 }}>
          <div>
            <div style={{ fontFamily:"'Space Grotesk',sans-serif", fontSize:18, fontWeight:800, color:accent }}>{ch.name}</div>
            <div style={{ fontSize:12, color:'rgba(255,255,255,0.45)' }}>{ch.handle} · {ch.cat}</div>
          </div>
          <div style={{ textAlign:'right' }}>
            <div style={{ fontFamily:"'Space Grotesk',sans-serif", fontSize:32, fontWeight:900, color:accent, lineHeight:1 }}>{subs.length}</div>
            <div style={{ fontSize:11, color:'rgba(255,255,255,0.4)', textTransform:'uppercase', letterSpacing:1 }}>subscribers</div>
          </div>
        </div>
      )}

      {/* Add manual */}
      <div style={{ background:'rgba(255,255,255,0.03)', border:'1px solid rgba(255,255,255,0.1)', borderRadius:14, padding:18, marginBottom:14 }}>
        <h4 style={{ color:'#c084fc', margin:'0 0 12px', fontSize:13, fontFamily:"'Space Grotesk',sans-serif", textTransform:'uppercase', letterSpacing:1 }}>+ Add One Subscriber</h4>
        <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fit,minmax(180px,1fr))', gap:10, marginBottom:10 }}>
          <AInput label="Name *"        value={manForm.name}         onChange={v=>setManForm({...manForm,name:v})}         placeholder="John Doe" />
          <AInput label="Handle"        value={manForm.handle}       onChange={v=>setManForm({...manForm,handle:v})}       placeholder="@johndoe" />
          <AInput label="Email"         value={manForm.email}        onChange={v=>setManForm({...manForm,email:v})}        placeholder="john@gmail.com" />
          <AInput label="Subscriber ID" value={manForm.subscriberId} onChange={v=>setManForm({...manForm,subscriberId:v})} placeholder="UCxxxxxx" />
          <AInput label="Phone"         value={manForm.phone}        onChange={v=>setManForm({...manForm,phone:v})}        placeholder="+91 9876543210" />
        </div>
        <div style={{ display:'flex', gap:10, alignItems:'center' }}>
          <ABtn onClick={addManual} variant="primary">+ Add Subscriber</ABtn>
          {msg && <span style={{ fontSize:13, color: msg.ok?'#4ade80':'#f87171' }}>{msg.text}</span>}
        </div>
      </div>

      {/* Bulk paste */}
      <div style={{ background:'rgba(255,255,255,0.03)', border:'1px solid rgba(255,255,255,0.1)', borderRadius:14, padding:18, marginBottom:20 }}>
        <h4 style={{ color:'#22d3ee', margin:'0 0 8px', fontSize:13, fontFamily:"'Space Grotesk',sans-serif", textTransform:'uppercase', letterSpacing:1 }}>📝 Bulk Paste</h4>
        <p style={{ fontSize:12, color:'rgba(255,255,255,0.45)', margin:'0 0 10px' }}>One per line. Format: <code style={{ color:'#22d3ee' }}>Name, @handle, email, subscriberId, phone</code> — only Name is required.</p>
        <textarea value={paste} onChange={e=>setPaste(e.target.value)} rows={6} placeholder={"John Doe, @johndoe, john@gmail.com\nJane Smith\nAlex Kumar, @alex"} style={{ width:'100%', padding:'10px 14px', background:'rgba(255,255,255,0.06)', border:'1px solid rgba(255,255,255,0.12)', borderRadius:10, color:'#e8e8f8', fontSize:13, outline:'none', fontFamily:'Inter,sans-serif', resize:'vertical', lineHeight:1.6, marginBottom:10 }}/>
        <div style={{ display:'flex', gap:10 }}>
          <ABtn onClick={addPaste} variant="primary">Add {paste.split('\n').filter(l=>l.trim()).length} Subscribers</ABtn>
          {subs.length>0 && <ABtn onClick={clearAll} variant="danger">Clear all subs for this channel</ABtn>}
        </div>
      </div>

      {/* List */}
      <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:10 }}>
        <h4 style={{ color:'#e8e8f8', margin:0, fontSize:14, fontFamily:"'Space Grotesk',sans-serif" }}>Current list ({subs.length})</h4>
        {subs.length>0 && <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search names..." style={{ padding:'6px 12px', background:'rgba(255,255,255,0.05)', border:'1px solid rgba(255,255,255,0.1)', borderRadius:10, color:'#e8e8f8', fontSize:12, outline:'none', width:200 }}/>}
      </div>
      {subs.length === 0 ? (
        <div style={{ padding:'32px', textAlign:'center', color:'rgba(255,255,255,0.3)', fontSize:14, background:'rgba(255,255,255,0.02)', border:'1px dashed rgba(255,255,255,0.08)', borderRadius:14 }}>
          <div style={{ fontSize:32, marginBottom:10 }}>👥</div>
          No subscribers in this channel's pool yet — add some above
        </div>
      ) : (
        <div style={{ display:'flex', flexDirection:'column', gap:6, maxHeight:400, overflowY:'auto' }}>
          {filtered.map((s,i) => (

// ---- DASHBOARD STATS ----
function DashStats({ channels, videos }) {
  const totalVideos = Object.values(videos).reduce((a,ch)=>a+Object.values(ch).reduce((b,vl)=>b+(vl.length||0),0),0);
  const cats = Array.from(new Set(channels.map(c=>c.cat)));
  const avgScore = Math.round(channels.reduce((a,c)=>a+c.score,0)/channels.length);
  const stats = [
    { label:'Channels', val: channels.length, color:'#22d3ee' },
    { label:'Playlists', val: channels.reduce((a,c)=>a+c.playlists.length,0), color:'#c084fc' },
    { label:'Videos Added', val: totalVideos, color:'#4ade80' },
    { label:'Categories', val: cats.length, color:'#facc15' },
    { label:'Avg Score', val: avgScore, color:'#fb923c' },
  ];
  return (
    <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fill,minmax(140px,1fr))', gap:12, marginBottom:28 }}>
      {stats.map(s => (
        <div key={s.label} style={{ background:'rgba(255,255,255,0.03)', border:'1px solid rgba(255,255,255,0.08)', borderRadius:14, padding:'16px 18px' }}>
          <div style={{ fontFamily:"'Space Grotesk',sans-serif", fontSize:28, fontWeight:800, color: s.color }}>{s.val}</div>
          <div style={{ fontSize:12, color:'rgba(255,255,255,0.35)', textTransform:'uppercase', letterSpacing:1 }}>{s.label}</div>
        </div>
      ))}
    </div>
  );
}

        });
        setData(d => ({ ...d, ...next }));
      }, [localSocial]);

      useEffect(() => { window.pvReloadData = reloadData; }, [reloadData]);

      // ---- Connect Supabase ----
      const connectSupabase = useCallback(() => {
        if (supabaseUrl && supabaseKey && window.supabase) {
          try {
            const client = window.supabase.createClient(supabaseUrl, supabaseKey);
            setSupabase(client);
            PVDB.setClient(client);
            localStorage.setItem('pv_sb_url', supabaseUrl);
            localStorage.setItem('pv_sb_key', supabaseKey);
          } catch(e) { console.warn('Supabase connect failed', e); }
        }
      }, [supabaseUrl, supabaseKey]);

      useEffect(() => { connectSupabase(); }, [connectSupabase]);
      useEffect(() => { reloadData(); }, [supabase, reloadData]);


      // ---- Secret login: triple-click the PUJIVERSE logo ----
      const handleLogoClick = useCallback(() => {
        const c = clickRef.current;
        c.count += 1;
        if (c.timer) clearTimeout(c.timer);
        if (c.count >= 3) { c.count = 0; setView('login'); }
        else { c.timer = setTimeout(() => { c.count = 0; }, 1200); }
      }, []);

      useEffect(() => {
        const el = document.getElementById('logo-click-target');
        if (el) el.onclick = handleLogoClick;
      });

      const channels = data.mergedChannels && data.mergedChannels.length ? data.mergedChannels : CHANNELS;

      return (
        <>
          <CosmicCanvas />
          <RocketCursor />

          {(view==='solar' || view==='channel' || view==='hub') && (
            <div style={{ position:'fixed', bottom:24, left:24, zIndex:8000, display:'flex', gap:8, flexWrap:'wrap' }}>
              <NavChip active={view==='solar'} onClick={()=>{ setView('solar'); setActiveCh(null); }}>🪐 Solar</NavChip>
              <NavChip active={view==='hub'} onClick={()=>setView('hub')}>🛰 Hub</NavChip>
              <NavChip onClick={()=>setView('classic')}>📇 Grid view</NavChip>
            </div>
          )}

          {view === 'login' && (
            <LoginModal onLogin={() => setView('admin')} onClose={() => setView('solar')} />
          )}

          {view === 'solar' && (
            <SolarSystem channels={channels} onOpenChannel={(ch)=>{ setActiveCh(ch); setView('channel'); }} onAdminClick={()=>setView('login')} />
          )}

          {view === 'channel' && activeCh && (
            <ChannelWorld ch={activeCh} data={data}
              onBack={()=>{ setView('solar'); setActiveCh(null); }}
              onOpenPlaylists={(ch)=>{ window.open(ch.url, '_blank'); }} />
          )}

          {view === 'hub' && (
            <SocialHub data={data} onBack={()=>setView('solar')} />
          )}

          {view === 'classic' && (
            <PublicView
              onAdminClick={() => setView('login')}
              videos={localVideos}
              social={localSocial}
              websites={localWebsites}
              posts={localPosts}
              onBackToSpace={()=>setView('solar')}
            />
          )}

          {view === 'admin' && (
            <AdminPanel
              onBack={() => { setView('solar'); reloadData(); }}
              supabase={supabase}
              supabaseUrl={supabaseUrl}
              supabaseKey={supabaseKey}
              setSupabaseUrl={setSupabaseUrl}
              setSupabaseKey={setSupabaseKey}
              onConnectSupabase={connectSupabase}
              localChannels={localChannels}
              setLocalChannels={setLocalChannels}
              localVideos={localVideos}
              setLocalVideos={setLocalVideos}
              localSocial={localSocial}
              setLocalSocial={setLocalSocial}
              localWebsites={localWebsites}
              setLocalWebsites={setLocalWebsites}
              localPosts={localPosts}
              setLocalPosts={setLocalPosts}
            />
          )}

          {(view==='solar' || view==='channel' || view==='hub' || view==='classic') && (
            <AIChat supabase={supabase} supabaseUrl={supabaseUrl} data={{ ...data, channels }} />
          )}
        </>
      );
    }

    function NavChip({ children, active, onClick }) {
      return (
        <button onClick={onClick} style={{
          padding:'8px 14px', borderRadius:999, fontSize:13, fontWeight:600, cursor:'pointer',
          background: active ? 'rgba(34,211,238,0.18)' : 'rgba(12,12,24,0.8)',
          border:`1px solid ${active ? '#22d3ee' : 'rgba(255,255,255,0.12)'}`,
          color: active ? '#22d3ee' : 'rgba(255,255,255,0.7)', backdropFilter:'blur(8px)'
        }}>{children}</button>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  
</script>
</body>
</html>
